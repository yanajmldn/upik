<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents | UPIK PTSB</title>
    <link rel="icon" type="image/jpeg" href="img/logoupik.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.goo gleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #f7fafc,
                    #eaf3fb
                );
            color: #11233e;
            min-height: 100vh;
        }

        header {
            height: 82px;
            background: #11233e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 3px;
        }

        .back-home {
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.35);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            transition: 0.25s;
        }

        .back-home:hover {
            background: white;
            color: #11233e;
        }

        main {
            width: min(1150px, 90%);
            margin: auto;
            padding: 70px 0;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 55px;
        }

        .small-title {
            color: #3d4a86;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-heading h1 {
            font-family:
                "Playfair Display",
                serif;
            font-size:
                clamp(40px, 6vw, 65px);
            color: #11233e;
            margin-bottom: 12px;
        }

        .page-heading p {
            color: #667085;
            font-size: 15px;
            max-width: 600px;
            margin: auto;
            line-height: 1.7;
        }

        #yearSection {
            display: block;
        }

        .year-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 22px;
        }

        .year-card {
            position: relative;
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            min-height: 190px;
            border: 1px solid #e1e8ef;
            cursor: pointer;
            overflow: hidden;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }

        .year-card::before {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #eaf3fb;
            right: -40px;
            bottom: -40px;
            transition: 0.3s;
        }

        .year-card:hover {
            transform: translateY(-8px);
            border-color: #3d4a86;
            box-shadow:
                0 18px 40px rgba(17,35,62,0.12);
        }

        .year-card:hover::before {
            transform: scale(1.5);
        }

        .folder-icon {
            position: relative;
            z-index: 2;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .year-card h2 {
            position: relative;
            z-index: 2;
            font-family:
                "Playfair Display",
                serif;
            font-size: 36px;
            color: #11233e;
            margin-bottom: 5px;
        }

        .year-card p {
            position: relative;
            z-index: 2;
            color: #7b8494;
            font-size: 12px;
        }

        .arrow {
            position: absolute;
            right: 22px;
            top: 22px;
            font-size: 20px;
            color: #3d4a86;
            z-index: 2;
        }

        #documentSection {
            display: none;
        }

        .document-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .back-years {
            border: none;
            background: white;
            color: #11233e;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid #dce4eb;
            transition: 0.2s;
        }

        .back-years:hover {
            background: #11233e;
            color: white;
        }

        .selected-year {
            font-family:
                "Playfair Display",
                serif;
            font-size: 35px;
            color: #11233e;
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 48px;
            border: 1px solid #dce4eb;
            border-radius: 14px;
            background: white;
            outline: none;
            font-family:
                "DM Sans",
                sans-serif;
            font-size: 14px;
            color: #11233e;
        }

        .search-box input:focus {
            border-color: #3d4a86;
            box-shadow:
                0 0 0 3px rgba(61,74,134,0.08);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #7b8494;
        }

        .document-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .document-card {
            background: white;
            border: 1px solid #e1e8ef;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: 0.25s;
        }

        .document-card:hover {
            transform: translateX(4px);
            box-shadow:
                0 10px 30px rgba(17,35,62,0.08);
            border-color: #b9cde0;
        }

        .document-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .pdf-icon {
            min-width: 52px;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #fcebea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .document-info h3 {
            color: #11233e;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .document-info p {
            color: #7b8494;
            font-size: 12px;
        }

        .document-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .document-actions a {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            transition: 0.2s;
        }

        .preview-btn {
            background: #eaf3fb;
            color: #11233e;
        }

        .preview-btn:hover {
            background: #d7e9f6;
        }

        .download-btn {
            background: #3d4a86;
            color: white;
        }

        .download-btn:hover {
            background: #11233e;
        }

        .preview-area {
            display: none;
            margin-top: 30px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #dce4eb;
            box-shadow:
                0 15px 40px rgba(17,35,62,0.10);
        }

        .preview-header {
            background: #11233e;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preview-header h3 {
            font-size: 14px;
        }

        .close-preview {
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .close-preview:hover {
            background: white;
            color: #11233e;
        }

        .pdf-frame {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }

        .no-results {
            display: none;
            text-align: center;
            padding: 50px;
            color: #7b8494;
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e8ef;
        }

        @media (max-width: 850px) {
            .year-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .document-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .document-actions {
                width: 100%;
            }

            .document-actions a {
                flex: 1;
                text-align: center;
            }
        }

        @media (max-width: 550px) {
            header {
                padding: 0 20px;
            }

            .brand span {
                font-size: 16px;
            }

            .back-home {
                font-size: 11px;
                padding: 8px 12px;
            }

            main {
                width: 92%;
                padding: 45px 0;
            }

            .page-heading {
                margin-bottom: 35px;
            }

            .year-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .year-card {
                min-height: 160px;
                padding: 25px 18px;
            }

            .year-card h2 {
                font-size: 30px;
            }

            .selected-year {
                font-size: 28px;
            }

            .document-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .pdf-frame {
                height: 500px;
            }

        }

    </style>
</head>
<body>

<header>
    <a href="index.html" class="brand">
        <img
            src="img/logoupik.jpg"
            alt="UPIK PTSB"
        >
        <span>
            UPIK PTSB
        </span>
    </a>
    <a href="index.html" class="back-home">
        ← Back to Home
    </a>
</header>

<main>
    <div class="page-heading">
        <div class="small-title">
            UPIK PTSB<br>
            NJIEA Documents
        </div>
        <h1> 
        </h1>
        <p>
           
    </div>

    
    <section id="yearSection">
        <div class="year-grid">
            <div
                class="year-card"
                onclick="showDocuments('2022')"
            >
                <div class="folder-icon">
                </div>
                <h2>
                    2022
                </h2>
                <p>
                    View documents
                </p>
                <div class="arrow">
                    →
                </div>
            </div>
            <div
                class="year-card"
                onclick="showDocuments('2023')"
            >
                <h2>
                    2023
                </h2>
                <p>
                    View documents
                </p>
                <div class="arrow">
                    →
                </div>
            </div>
            <div
                class="year-card"
                onclick="showDocuments('2024')"
            >
                <h2>
                    2024
                </h2>
                <p>
                    View documents
                </p>
                <div class="arrow">
                    →
                </div>
            </div>
            <div
                class="year-card"
                onclick="showDocuments('2025')"
            >
                <h2>
                    2025
                </h2>
                <p>
                    View documents
                </p>
                <div class="arrow">
                    →
                </div>
            </div>
        </div>
    </section>

    <section id="documentSection">
        <div class="document-top">
            <div>
                <button
                    class="back-years"
                    onclick="backToYears()"
                >
                    ← Back to Years
                </button>
                <h2
                    class="selected-year"
                    id="selectedYear"
                >
                    Documents 2025
                </h2>
            </div>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search documents..."
                onkeyup="searchDocuments()">
        </div>

        <div
            class="document-list"
            id="documentList"
        >

        </div>
        <div
            class="no-results"
            id="noResults"
        >

            No documents found.
        </div>

        <div
            class="preview-area"
            id="previewArea"
        >
            <div class="preview-header">
                <h3 id="previewTitle">
                    PDF Preview
                </h3>
                <button
                    class="close-preview"
                    onclick="closePreview()"
                >
                    x
                </button>
            </div>
            <iframe
                class="pdf-frame"
                id="pdfFrame"
                src=""
            >
            </iframe>
        </div>
    </section>
</main>

<script>
const documents = {
    "2022": [
        {
            name: "NJIEA 2022",
            type: "PDF",
            size: "6.92 MB",
            file: "2022_NJIEA.pdf"
        },
    ],
    "2023": [
        {
            name: "NJIEA 2023",
            type: "PDF",
            size: "7.60 MB",
            file: "2023_NJIEA.pdf"
        },
    ],
    "2024": [
        {
            name: "NJIEA 2024",
            type: "PDF",
            size: "6.15 MB",
            file: "2024_NJIEA.pdf"
        },
    ],
    "2025": [
        {
            name: "NJIEA 2025",
            type: "PDF",
            size: "17.4 MB",
            file: "2025_NJIEA.pdf"
        },
    ]
};

let currentYear = "";
function showDocuments(year) {
    currentYear = year;
    document
        .getElementById("yearSection")
        .style.display = "none";
    document
        .getElementById("documentSection")
        .style.display = "block";
    document
        .getElementById("selectedYear")
        .textContent =
        "Documents " + year;
    document
        .getElementById("searchInput")
        .value = "";
    closePreview();
    displayDocuments(
        documents[year]
    );
}

function displayDocuments(list) {
    const container =
        document.getElementById("documentList");
    container.innerHTML = "";
    if (list.length === 0) {
        document
            .getElementById("noResults")
            .style.display = "block";
        return;
    }

    document
        .getElementById("noResults")
        .style.display = "none";
    list.forEach(function(doc) {
        const card =
            document.createElement("div");
        card.className =
            "document-card";
        card.innerHTML = `
            <div class="document-info">
                <div class="pdf-icon">
                    📄
                </div>
                <div>
                    <h3>
                        ${doc.name}
                    </h3>
                    <p>
                        ${doc.type} • ${doc.size}
                    </p>
                </div>
            </div>
            <div class="document-actions">
                <a
                    href="${doc.file}"
                    target="_blank"
                    class="preview-btn"
                >
                    ↗ Open
                </a>
                <a
                    href="${doc.file}"
                    class="preview-btn"
                    onclick="previewDocument(event, '${doc.file}', '${doc.name}')"
                >
                    👁 Preview
                </a>
                <a
                    href="${doc.file}"
                    download
                    class="download-btn"
>
                    ↓ Download
                </a>
            </div>
        `;
        container.appendChild(card);
    });
}
function searchDocuments() {
    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase();
    const filtered =
        documents[currentYear].filter(
            function(doc) {
                return doc.name
                    .toLowerCase()
                    .includes(search);
            }
        );
    displayDocuments(filtered);
}

function previewDocument(
    event,
    file,
    title
) {
    event.preventDefault();
    document
        .getElementById("previewArea")
        .style.display = "block";
    document
        .getElementById("previewTitle")
        .textContent = title;
    document
        .getElementById("pdfFrame")
        .src = file;
    document
        .getElementById("previewArea")
        .scrollIntoView({
            behavior: "smooth"
        });
}

function closePreview() {
    document
        .getElementById("previewArea")
        .style.display = "none";
    document
        .getElementById("pdfFrame")
        .src = "";
}

function backToYears() {
    closePreview();
    document
        .getElementById("documentSection")
        .style.display = "none";
    document
        .getElementById("yearSection")
        .style.display = "block";
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>
</body>
</html>
